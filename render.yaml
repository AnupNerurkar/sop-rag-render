services:
  - type: web
    name: sop-rag-render
    runtime: docker
    dockerfilePath: ./Dockerfile
    # Free plan: no persistent disk (Render only attaches one from Starter
    # up), and a free web service also spins down after 15 minutes idle,
    # coming back as a brand-new container. The pre-embedded corpus
    # (seed_ledger.db) is baked into the image (see Dockerfile) so it
    # survives spin-down -- it's part of the image, not the writable
    # layer. Anything uploaded or deleted at *runtime* on top of that
    # baked-in corpus still does NOT survive a spin-down or redeploy --
    # that would need a real external database (e.g. Neon Postgres, which
    # this project used before the move to local SQLite) to fix.
    #
    # No build-time secrets needed: the corpus is shipped already embedded,
    # so GROQ_API_KEY / HF_API_TOKEN are only read at runtime (below), for
    # embedding the user's query and generating answers.
    plan: free
    envVars:
      - key: LLM_BACKEND
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: HF_API_TOKEN
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
