services:
  - type: web
    name: sop-rag-render
    runtime: docker
    dockerfilePath: ./Dockerfile
    # Free plan: no persistent disk (Render only attaches one from Starter
    # up), and a free web service also spins down after 15 minutes idle,
    # coming back as a brand-new container. SQLite holds documents, chunks,
    # embeddings, and the FTS5 index all in one file, plus uploads land in
    # data/staging/ (see ledger.py, document_manager.py) -- both are on the
    # container's local disk, so anything uploaded or deleted during a
    # session does NOT survive the next spin-down or redeploy. That's an
    # architecture constraint of running SQLite without a disk, not
    # something a config change here can fix -- moving to a free external
    # database (e.g. Neon Postgres, which this project used before the
    # move to local SQLite) is the real fix if persistence is needed on
    # the free plan; ask before doing that migration, it's a real rewrite.
    plan: free
    envVars:
      - key: LLM_BACKEND
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: HF_API_TOKEN
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
