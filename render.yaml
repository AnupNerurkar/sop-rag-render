services:
  - type: web
    name: sop-rag-render
    runtime: docker
    dockerfilePath: ./Dockerfile
    # Free plan: no persistent disk (Render only attaches one from Starter
    # up), and a free web service also spins down after 15 minutes idle,
    # coming back as a brand-new container. The seed_documents/ corpus is
    # baked into the image at build time (see Dockerfile, scripts/bake_
    # corpus.py) specifically because of this -- it survives spin-down
    # since it's part of the image, not the writable layer. Anything
    # uploaded or deleted at *runtime* through the app, on top of that
    # baked-in corpus, still does NOT survive a spin-down or redeploy --
    # that part would need a real external database (e.g. Neon Postgres,
    # which this project used before the move to local SQLite) to fix.
    plan: free
    # Required before the first deploy: add two Secret Files in the Render
    # dashboard (Environment -> Secret Files), named exactly "groq_api_key"
    # and "hf_api_token", containing just the raw key value each. The
    # Dockerfile mounts them by that name to embed the seed corpus at
    # build time; without them the build step fails outright rather than
    # silently shipping an empty corpus.
    envVars:
      - key: LLM_BACKEND
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: HF_API_TOKEN
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
